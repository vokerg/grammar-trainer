name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NODE_ENV: test
      LLM_PROVIDER: mock
      MOCK_LLM_MODE: success
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database schema
        run: pnpm db:push

      - name: Format sources
        run: pnpm format

      - name: Build all packages
        id: build
        continue-on-error: true
        run: pnpm -r build 2>&1 | tee build.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm -r lint 2>&1 | tee lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm -r typecheck 2>&1 | tee typecheck.log

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm -r test 2>&1 | tee test.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-trainer-validation-logs
          path: '*.log'
          if-no-files-found: error

      - name: Enforce quality gate
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          printf 'build=%s\nlint=%s\ntypecheck=%s\ntest=%s\n' \
            "$BUILD_OUTCOME" "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME"
          test "$BUILD_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$TYPECHECK_OUTCOME" = success
          test "$TEST_OUTCOME" = success

      - name: Upload production builds
        uses: actions/upload-artifact@v4
        with:
          name: grammar-trainer-builds
          path: |
            apps/api/dist
            apps/web/dist
            packages/*/dist
          if-no-files-found: error
