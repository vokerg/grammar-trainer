name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NODE_ENV: test
      LLM_PROVIDER: mock
      MOCK_LLM_MODE: success
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database schema
        run: pnpm db:push

      - name: Format sources
        run: pnpm format

      - name: Build all packages
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Upload production builds
        uses: actions/upload-artifact@v4
        with:
          name: grammar-trainer-builds
          path: |
            apps/api/dist
            apps/web/dist
            packages/*/dist
          if-no-files-found: error
